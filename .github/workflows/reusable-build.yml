name: Build

on: workflow_call

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install
        run: npm ci
      - name: Upload node_modules
        uses: actions/upload-artifact@v7
        with:
          name: node-modules
          path: node_modules
          retention-days: 1
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: node-modules
          path: node_modules
      - run: npm run lint
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - name: Download node_modules
        uses: actions/download-artifact@v8
        with:
          name: node-modules
          path: node_modules
      - name: Debug working directory
        run: |
          echo "=== Aktuelles Verzeichnis ==="
          pwd
          echo "=== Top-Level Inhalt ==="
          ls -la
          echo "=== node_modules Inhalt (erste 20 Einträge) ==="
          ls -la node_modules | head -20
      - run: npm run build
      - name: Upload app artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
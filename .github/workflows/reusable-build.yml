name: Build

on: workflow_call

jobs:
  reusable-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload app artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist